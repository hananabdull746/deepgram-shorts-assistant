<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · ClipCue</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="login-shell"><main class="login-card"><a class="brand" href="/login"><span class="brand-mark">|</span> CLIP<span>CUE</span></a><p class="eyebrow">PRIVATE EDIT DESK</p><h1>Sign in to ClipCue</h1><p class="muted">Your source videos and finished cuts stay on this server.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post" action="/login" class="stack"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button primary">Sign in</button></form><p class="fineprint">Only authorized administrators can access this workspace.</p></main></body></html>
